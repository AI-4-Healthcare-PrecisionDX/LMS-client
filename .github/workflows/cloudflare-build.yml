name: Cloudflare Build with Bun

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Cloudflare Project with Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1.36'
        
      - name: Install Wrangler CLI
        run: bun install -g wrangler
      
      - name: Install dependencies
        run: bun install
   
      - name: Run Cloudflare build
        run: wrangler build
