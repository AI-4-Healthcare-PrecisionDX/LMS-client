name: Cloudflare Build Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Cloudflare Project
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1.36'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # or your project's Node.js version
          cache: 'bun'
  
      - name: Install Wrangler CLI
        run: bun install -g wrangler

      - name: Install project dependencies
        run: bun install

      - name: Run Cloudflare build
        run: wrangler build


