name: ESLint

on:
  push:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1.36'

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bunx eslint app
